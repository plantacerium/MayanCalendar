<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgCosmic" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="45%" stop-color="#050e17" />
      <stop offset="80%" stop-color="#020508" />
      <stop offset="100%" stop-color="#000203" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="35%" stop-color="#F4D03F" />
      <stop offset="70%" stop-color="#D4AC0D" />
      <stop offset="100%" stop-color="#9A7D0A" />
    </linearGradient>

    <!-- Cyan Laser Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00FFB2" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Obsidian & Basalt Tier Gradients -->
    <linearGradient id="tierTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143445" />
      <stop offset="100%" stop-color="#0B1E28" />
    </linearGradient>
    <linearGradient id="tierLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C202B" />
      <stop offset="100%" stop-color="#051016" />
    </linearGradient>
    <linearGradient id="tierRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4054" />
      <stop offset="100%" stop-color="#0E232E" />
    </linearGradient>

    <!-- Violet Glow Gradient -->
    <linearGradient id="violetAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BB8FCE" />
      <stop offset="50%" stop-color="#8E44AD" />
      <stop offset="100%" stop-color="#4A235A" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="laserBeamGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Space Backdrop -->
  <rect width="900" height="900" fill="url(#bgCosmic)" />

  <!-- ========================================== -->
  <!-- LAYER 1: HOLOGRAPHIC MAYAN CALENDAR WHEELS -->
  <!-- ========================================== -->
  <g transform="translate(450, 470)" filter="url(#cyanGlow)">
    <!-- Outer Tzolk'in 260-Day Gear Ring -->
    <circle cx="0" cy="0" r="390" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="8 14" opacity="0.4" />
    <circle cx="0" cy="0" r="365" fill="none" stroke="url(#goldShine)" stroke-width="2" stroke-dasharray="24 8" opacity="0.75" />
    <circle cx="0" cy="0" r="340" fill="none" stroke="#00FFB2" stroke-width="1.5" opacity="0.5" />

    <!-- 20 Segmented Tzolk'in Solar Seal Cartouches along Wheel Rim -->
    <g stroke="url(#goldShine)" stroke-width="1.8" fill="#061219" opacity="0.85">
      <!-- 20 Rotational Marks around the Circle -->
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(0)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(18)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(36)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(54)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(72)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(90)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(108)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(126)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(144)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(162)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(180)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(198)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(216)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(234)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(252)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(270)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(288)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(306)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(324)" />
      <rect x="-14" y="-380" width="28" height="24" rx="4" transform="rotate(342)" />
    </g>

    <!-- Inner Haab' 365-Day Solar Gear Ring -->
    <circle cx="0" cy="0" r="300" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />
    <circle cx="0" cy="0" r="280" fill="none" stroke="#9B59B6" stroke-width="1.5" stroke-dasharray="16 10" opacity="0.5" />

    <!-- Cardinal Astronomical Pointer Rays -->
    <line x1="0" y1="-395" x2="0" y2="-320" stroke="#FFF5B8" stroke-width="3" />
    <line x1="0" y1="395" x2="0" y2="320" stroke="#FFF5B8" stroke-width="3" />
    <line x1="-395" y1="0" x2="-320" y2="0" stroke="#FFF5B8" stroke-width="3" />
    <line x1="395" y1="0" x2="320" y2="0" stroke="#FFF5B8" stroke-width="3" />
  </g>

  <!-- ========================================== -->
  <!-- LAYER 2: COSMIC STARGATE BEAM (AXIS MUNDI) -->
  <!-- ========================================== -->
  <g filter="url(#laserBeamGlow)">
    <line x1="450" y1="320" x2="450" y2="30" stroke="url(#cyanNeon)" stroke-width="16" stroke-linecap="round" />
    <line x1="450" y1="320" x2="450" y2="30" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    
    <!-- Concentric Harmonic Resonance Rings Ascending into Space -->
    <ellipse cx="450" cy="220" rx="45" ry="14" fill="none" stroke="#00FFB2" stroke-width="2" />
    <ellipse cx="450" cy="140" rx="75" ry="20" fill="none" stroke="#00E5FF" stroke-width="2.5" />
    <ellipse cx="450" cy="65" rx="110" ry="26" fill="none" stroke="url(#goldShine)" stroke-width="3" stroke-dasharray="14 10" />
  </g>

  <!-- ========================================== -->
  <!-- LAYER 3: LEVITATING VOXEL STEP-PYRAMID     -->
  <!-- ========================================== -->

  <!-- TIER 1 (Grand Base Tier - Floating at Y=640) -->
  <g filter="url(#cyanGlow)">
    <polygon points="450,560 700,630 450,700 200,630" fill="url(#tierTopGrad)" stroke="#00E5FF" stroke-width="2.5" />
    <polygon points="200,630 450,700 450,735 200,665" fill="url(#tierLeftGrad)" stroke="#00E5FF" stroke-width="2.5" />
    <polygon points="450,700 700,630 700,665 450,735" fill="url(#tierRightGrad)" stroke="#00E5FF" stroke-width="2.5" />
    <!-- Center Stairway Illuminator -->
    <polygon points="450,560 485,570 450,700 415,690" fill="#00FFB2" opacity="0.35" />
  </g>

  <!-- TIER 2 (Middle Tier - Levitating with Gap at Y=540) -->
  <g filter="url(#cyanGlow)">
    <polygon points="450,480 630,530 450,580 270,530" fill="url(#tierTopGrad)" stroke="#00FFB2" stroke-width="2.5" />
    <polygon points="270,530 450,580 450,610 270,560" fill="url(#tierLeftGrad)" stroke="#00FFB2" stroke-width="2.5" />
    <polygon points="450,580 630,530 630,560 450,610" fill="url(#tierRightGrad)" stroke="#00FFB2" stroke-width="2.5" />
    <polygon points="450,480 480,488 450,580 420,572" fill="#00FFB2" opacity="0.4" />
  </g>

  <!-- TIER 3 (Upper Tier - Levitating at Y=445) -->
  <g filter="url(#cyanGlow)">
    <polygon points="450,405 560,445 450,485 340,445" fill="url(#tierTopGrad)" stroke="#00E5FF" stroke-width="2.5" />
    <polygon points="340,445 450,485 450,510 340,470" fill="url(#tierLeftGrad)" stroke="#00E5FF" stroke-width="2.5" />
    <polygon points="450,485 560,445 560,470 450,510" fill="url(#tierRightGrad)" stroke="#00E5FF" stroke-width="2.5" />
    <polygon points="450,405 475,412 450,485 425,478" fill="#00FFB2" opacity="0.45" />
  </g>

  <!-- ========================================== -->
  <!-- LAYER 4: 4 AHAU SOLAR QUANTUM CYBER-MASK   -->
  <!-- ========================================== -->
  <!-- Positioned at the Summit / Temple Sanctuary -->
  <g transform="translate(450, 320)">

    <!-- Halo Octagonal Solar Cartouche -->
    <polygon points="0,-120 85,-85 120,0 85,85 0,120 -85,85 -120,0 -85,-85" 
             fill="#080512" stroke="url(#goldShine)" stroke-width="4" filter="url(#goldGlow)" />
    <polygon points="0,-102 72,-72 102,0 72,72 0,102 -72,72 -102,0 -72,-72" 
             fill="none" stroke="#9B59B6" stroke-width="2" stroke-dasharray="8 6" opacity="0.75" />

    <!-- Forehead Diadem & Brow Geometry -->
    <polygon points="-70,-45 0,-68 70,-45 50,-15 0,-25 -50,-15" 
             fill="#1A102E" stroke="url(#goldShine)" stroke-width="3" />

    <!-- Shamanic Third Eye (Quantum Kuramoto Oscillator) -->
    <g transform="translate(0, -68)" filter="url(#goldGlow)">
      <circle cx="0" cy="0" r="24" fill="#0D0719" stroke="url(#goldShine)" stroke-width="3" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="5 3" />
      <circle cx="0" cy="0" r="9" fill="#FFF5B8" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
      <!-- Ray Emitters -->
      <line x1="0" y1="-24" x2="0" y2="-40" stroke="url(#goldShine)" stroke-width="3" />
      <line x1="-16" y1="-18" x2="-28" y2="-30" stroke="url(#goldShine)" stroke-width="2.5" />
      <line x1="16" y1="-18" x2="28" y2="-30" stroke="url(#goldShine)" stroke-width="2.5" />
    </g>

    <!-- Angular Solar Visor Eyes (Cybernetic HUD) -->
    <g filter="url(#goldGlow)">
      <!-- Left Eye -->
      <polygon points="-58,8 -14,-2 -22,25 -64,22" fill="#180C2C" stroke="url(#goldShine)" stroke-width="2.5" />
      <polygon points="-50,11 -18,4 -24,20 -54,18" fill="url(#goldShine)" opacity="0.9" />
      <!-- Right Eye -->
      <polygon points="58,8 14,-2 22,25 64,22" fill="#180C2C" stroke="url(#goldShine)" stroke-width="2.5" />
      <polygon points="50,11 18,4 24,20 54,18" fill="url(#goldShine)" opacity="0.9" />
    </g>

    <!-- Nose Bridge & Solar Keystones -->
    <polygon points="-12,-20 12,-20 16,50 -16,50" fill="#120822" stroke="#9B59B6" stroke-width="2" />
    <polygon points="-16,50 16,50 24,70 -24,70" fill="#201138" stroke="url(#goldShine)" stroke-width="2.5" />

    <!-- 4 Ahau Circular Solar Resonance Cheeks -->
    <g filter="url(#goldGlow)">
      <circle cx="-65" cy="55" r="22" fill="#0C0717" stroke="url(#goldShine)" stroke-width="2.5" />
      <circle cx="-65" cy="55" r="14" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="4 4" />
      <circle cx="-65" cy="55" r="6" fill="url(#goldShine)" />

      <circle cx="65" cy="55" r="22" fill="#0C0717" stroke="url(#goldShine)" stroke-width="2.5" />
      <circle cx="65" cy="55" r="14" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="4 4" />
      <circle cx="65" cy="55" r="6" fill="url(#goldShine)" />
    </g>

    <!-- Solar Breath Mouth (Harmonic Frequency Synthesizer) -->
    <rect x="-42" y="80" width="84" height="24" rx="5" fill="#0B0616" stroke="url(#goldShine)" stroke-width="2.5" filter="url(#goldGlow)" />
    <line x1="-30" y1="86" x2="-30" y2="98" stroke="#FFF5B8" stroke-width="2.5" />
    <line x1="-15" y1="84" x2="-15" y2="100" stroke="#FFF5B8" stroke-width="2.5" />
    <line x1="0" y1="82" x2="0" y2="102" stroke="#FFF5B8" stroke-width="3" />
    <line x1="15" y1="84" x2="15" y2="100" stroke="#FFF5B8" stroke-width="2.5" />
    <line x1="30" y1="86" x2="30" y2="98" stroke="#FFF5B8" stroke-width="2.5" />
  </g>

  <!-- ========================================== -->
  <!-- LAYER 5: THE 4 SACRED CAPACITOR NODES (4 AHAU) -->
  <!-- ========================================== -->
  <g filter="url(#goldGlow)">
    <!-- Node 1: Top-Left -->
    <circle cx="160" cy="180" r="22" fill="#080E17" stroke="url(#goldShine)" stroke-width="3.5" />
    <circle cx="160" cy="180" r="9" fill="#00E5FF" />
    <!-- Node 2: Top-Right -->
    <circle cx="740" cy="180" r="22" fill="#080E17" stroke="url(#goldShine)" stroke-width="3.5" />
    <circle cx="740" cy="180" r="9" fill="#00E5FF" />
    <!-- Node 3: Bottom-Left -->
    <circle cx="110" cy="680" r="22" fill="#080E17" stroke="url(#goldShine)" stroke-width="3.5" />
    <circle cx="110" cy="680" r="9" fill="#00FFB2" />
    <!-- Node 4: Bottom-Right -->
    <circle cx="790" cy="680" r="22" fill="#080E17" stroke="url(#goldShine)" stroke-width="3.5" />
    <circle cx="790" cy="680" r="9" fill="#00FFB2" />
  </g>

  <!-- ========================================== -->
  <!-- LAYER 6: FLOATING VIGESIMAL CODE SATELLITES -->
  <!-- ========================================== -->
  <!-- Left Side: Number 13 (2 Bars = 10, 3 Dots = 3) -->
  <g transform="translate(70, 420)" filter="url(#cyanGlow)">
    <circle cx="16" cy="0" r="7" fill="#00FFB2" />
    <circle cx="38" cy="0" r="7" fill="#00FFB2" />
    <circle cx="60" cy="0" r="7" fill="#00FFB2" />
    <rect x="6" y="16" width="64" height="9" rx="3" fill="#00E5FF" />
    <rect x="6" y="32" width="64" height="9" rx="3" fill="#00E5FF" />
    <text x="38" y="62" font-family="'Montserrat', monospace" font-size="11" font-weight="700" fill="#00FFB2" text-anchor="middle" letter-spacing="2">TONE 13</text>
  </g>

  <!-- Right Side: Sacred Shell Glyph (0 Zero Point / Completion) -->
  <g transform="translate(755, 420)" filter="url(#goldGlow)">
    <path d="M 8,24 C 8,0 68,0 68,24 C 68,48 8,48 8,24 Z" fill="#0A1622" stroke="url(#goldShine)" stroke-width="3" />
    <line x1="18" y1="24" x2="58" y2="24" stroke="url(#goldShine)" stroke-width="2" />
    <line x1="22" y1="14" x2="54" y2="14" stroke="url(#goldShine)" stroke-width="1.5" />
    <line x1="22" y1="34" x2="54" y2="34" stroke="url(#goldShine)" stroke-width="1.5" />
    <text x="38" y="64" font-family="'Montserrat', monospace" font-size="11" font-weight="700" fill="url(#goldShine)" text-anchor="middle" letter-spacing="2">ZERO • 0</text>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 7: TYPOGRAPHIC MASTER MARK           -->
  <!-- ========================================== -->
  <text x="450" y="805" font-family="'Cinzel', 'Montserrat', serif" font-size="28" font-weight="900" fill="url(#goldShine)" text-anchor="middle" letter-spacing="12" filter="url(#goldGlow)">
    4 AHAU • QUANTUM PYRAMID
  </text>
  <text x="450" y="842" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#00E5FF" text-anchor="middle" letter-spacing="8" opacity="0.9">
    FRACTAL MAYAN CALENDAR WHEEL • STELE 2032
  </text>
</svg>
