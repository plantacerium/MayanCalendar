[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mayan-stele"
version = "2.0.0"
description = "Ultimate Mayan Calendar, Fractal Pattern Analyzer & MCP Server"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Plantacerium" }
]
keywords = [
    "mayan-calendar",
    "astronomy",
    "kuramoto-model",
    "dresden-codex",
    "mcp-server",
    "pyside6",
    "fractal-analysis",
    "biocymatics"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "PySide6>=6.5.0",
]

[project.urls]
Homepage = "https://github.com/plantacerium/MayanCalendar"
Repository = "https://github.com/plantacerium/MayanCalendar"
